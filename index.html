<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wheelie Party Pure Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .hud-overlay {
            position: absolute;
            top: 4vh;
            left: 4vw;
            pointer-events: none;
            color: #00ffcc;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            z-index: 5;
        }
        .menu-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
        }
        .subtitle {
            font-size: 1.2rem;
            color: #8a8ab0;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }
        .start-btn {
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            color: #000;
            background: #00ffcc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s, background 0.2s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud-overlay">
            Score: <span id="scoreVal">0</span>
        </div>

        <div id="menuPanel" class="menu-panel">
            <h1 id="menuTitle">Wheelie Party</h1>
            <p id="menuSubtitle" class="subtitle">Hold SPACEBAR, UP ARROW, or CLICK & HOLD to pull back. Score points continuously by keeping your front wheel off the ground!</p>
            <button id="startBtn" class="start-btn">Ride</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuPanel = document.getElementById('menuPanel');
        const startBtn = document.getElementById('startBtn');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const scoreVal = document.getElementById('scoreVal');

        // High fidelity internal matrix configurations
        const V_WIDTH = 3840;  
        const V_HEIGHT = 2160; 
        canvas.width = V_WIDTH;
        canvas.height = V_HEIGHT;

        // Core physics configurations
        let gameState = 'MENU'; 
        let score = 0;
        let isPressing = false;
        let gameSpeed = 22;
        const groundY = V_HEIGHT - 500;
        let roadOffset = 0;

        // Motorcycle structural parameters
        const bike = {
            x: 900,
            angle: 0,
            angularVelocity: 0,
            length: 240,
            wheelRadius: 75,
            maxAngle: Math.PI / 2.1,
            torque: 0.015,
            gravity: 0.012
        };

        // Event structural mapping mechanics
        function setControlState(active) {
            if (gameState === 'PLAYING') {
                isPressing = active;
            } else if (gameState === 'GAMEOVER') {
                launchSession();
            }
        }

        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') { 
                e.preventDefault(); 
                setControlState(true); 
            } 
        });
        window.addEventListener('keyup', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                setControlState(false); 
            }
        });
        
        canvas.addEventListener('mousedown', (e) => { e.preventDefault(); setControlState(true); });
        canvas.addEventListener('mouseup', () => setControlState(false));
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); setControlState(true); });
        canvas.addEventListener('touchend', () => setControlState(false));
        startBtn.addEventListener('click', launchSession);

        function launchSession() {
            score = 0;
            bike.angle = 0;
            bike.angularVelocity = 0;
            isPressing = false;
            gameState = 'PLAYING';
            menuPanel.style.display = 'none';
            scoreVal.textContent = "0";
        }

        function triggerCrash() {
            gameState = 'GAMEOVER';
            menuTitle.textContent = "Flipped Over!";
            menuSubtitle.innerHTML = `You leaned back too far.<br><br>Final Score: <b>${Math.floor(score)}</b>`;
            startBtn.textContent = "Try Again";
            menuPanel.style.display = 'flex';
        }

        function updatePhysics() {
            // Apply rotational velocity calculations
            if (isPressing) {
                bike.angularVelocity += bike.torque;
            } else {
                bike.angularVelocity -= bike.gravity;
            }

            // Apply friction dampening forces
            bike.angularVelocity *= 0.96;
            bike.angle += bike.angularVelocity;

            // Enforce bottom boundary frame constraints
            if (bike.angle <= 0) {
                bike.angle = 0;
                bike.angularVelocity = 0;
            }

            // Enforce critical tipping crash bounds
            if (bike.angle > bike.maxAngle) {
                triggerCrash();
                return;
            }

            // Score continuous points only while front wheel is successfully in the air
            if (bike.angle > 0.02) {
                score += 1;
                scoreVal.textContent = Math.floor(score);
            }

            // Animate background ground landscape tracks
            roadOffset = (roadOffset - gameSpeed) % 200;
        }

        function renderGraphics() {
            // Clear current viewing window
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            // Draw Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#0a0a1a');
            skyGrad.addColorStop(1, '#151535');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // Draw Synthwave Grid Horizon Lines
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
            ctx.lineWidth = 4;
            for (let i = 0; i < V_WIDTH; i += 300) {
                ctx.beginPath();
                ctx.moveTo(i + (roadOffset * 0.2), 600);
                ctx.lineTo(i + (roadOffset * 0.2), groundY);
                ctx.stroke();
            }

            // Draw Core Asphalt Runway Road
            ctx.fillStyle = '#111116';
            ctx.fillRect(0, groundY, V_WIDTH, V_HEIGHT - groundY);

            // Draw Neon Runway Boundary Edge
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            ctx.fillRect(0, groundY, V_WIDTH, 12);
            ctx.shadowBlur = 0; // Reset canvas filter state instantly

            // Draw Track Guide Dash Markers
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = roadOffset; i < V_WIDTH + 200; i += 200) {
                ctx.fillRect(i, groundY + 150, 100, 12);
            }

            // Draw Motorcycle Vector Geometry
            ctx.save();
            const rearAxleX = bike.x;
            const rearAxleY = groundY - bike.wheelRadius;
            ctx.translate(rearAxleX, rearAxleY);
            ctx.rotate(-bike.angle);

            // Chassis Main Tube Frame Pipes
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(bike.length * 0.4, -bike.wheelRadius * 1.3);
            ctx.lineTo(bike.length * 0.8, -bike.wheelRadius * 1.4);
            ctx.lineTo(bike.length * 0.35, 0);
            ctx.closePath();
            ctx.stroke();

            // Front Axle Support Forks Columns
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(bike.length * 0.8, -bike.wheelRadius * 1.4);
            ctx.lineTo(bike.length, 0);
            ctx.stroke();

            // Rear Tire Outer Assembly Rim
            ctx.fillStyle = '#111';

ctx.strokeStyle = '#fff';
ctx.lineWidth = 14;
ctx.beginPath();
ctx.arc(0, 0, bike.wheelRadius, 0, Math.PI * 2);
ctx.fill();

// Front Tire Outer Assembly Rim
ctx.beginPath();
ctx.arc(bike.length, 0, bike.wheelRadius, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
// Inner Axle Hub Spoke Lines
ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
ctx.lineWidth = 4;
ctx.beginPath();
ctx.moveTo(-bike.wheelRadius, 0); ctx.lineTo(bike.wheelRadius, 0);
ctx.moveTo(0, -bike.wheelRadius); ctx.lineTo(0, bike.wheelRadius);
ctx.stroke();
ctx.save();
ctx.translate(bike.length, 0);
ctx.rotate(roadOffset * 0.05);

ctx.moveTo(-bike.wheelRadius, 0); ctx.lineTo(bike.wheelRadius, 0);

ctx.restore();
// Seat Cushion Base Pad
ctx.fillStyle = '#222';
ctx.fillRect(bike.length * 0.1, -bike.wheelRadius * 1.45, bike.length * 0.25, 25);
ctx.restore();
}
function gameLoop() {
if (gameState === 'PLAYING') {
updatePhysics();
}
renderGraphics();
requestAnimationFrame(gameLoop);
}
// Start execution sequence loops
gameLoop();
