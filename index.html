<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wheelie Party Pure Canvas Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const V_WIDTH = 3840;  
        const V_HEIGHT = 2160; 
        canvas.width = V_WIDTH;
        canvas.height = V_HEIGHT;

        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let isPressing = false;
        let gameSpeed = 22;
        const groundY = V_HEIGHT - 500;
        let roadOffset = 0;

        const bike = {
            x: 900,
            angle: 0,
            angularVelocity: 0,
            length: 240,
            wheelRadius: 75,
            maxAngle: Math.PI / 2.1,
            torque: 0.015,
            gravity: 0.012
        };

        // Single unified input capture structure
        function handleGlobalPressStart(e) {
            if (e) e.preventDefault();
            
            if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                launchSession();
            } else if (gameState === 'PLAYING') {
                isPressing = true;
            }
        }

        function handleGlobalPressEnd(e) {
            if (gameState === 'PLAYING') {
                isPressing = false;
            }
        }

        // Event mappings directly bound to window to bypass overlay traps
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') { 
                handleGlobalPressStart(e);
            } 
        });
        window.addEventListener('keyup', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleGlobalPressEnd(e);
            }
        });
        
        canvas.addEventListener('mousedown', handleGlobalPressStart);
        window.addEventListener('mouseup', handleGlobalPressEnd);
        canvas.addEventListener('touchstart', handleGlobalPressStart, { passive: false });
        window.addEventListener('touchend', handleGlobalPressEnd);

        function launchSession() {
            score = 0;
            bike.angle = 0;
            bike.angularVelocity = 0;
            isPressing = false;
            gameState = 'PLAYING';
        }

        function triggerCrash() {
            gameState = 'GAMEOVER';
        }

        function updatePhysics() {
            if (isPressing) {
                bike.angularVelocity += bike.torque;
            } else {
                bike.angularVelocity -= bike.gravity;
            }

            bike.angularVelocity *= 0.96;
            bike.angle += bike.angularVelocity;

            if (bike.angle <= 0) {
                bike.angle = 0;
                bike.angularVelocity = 0;
            }

            if (bike.angle > bike.maxAngle) {
                triggerCrash();
                return;
            }

            if (bike.angle > 0.02) {
                score += 1;
            }

            roadOffset = (roadOffset - gameSpeed) % 200;
        }

        function renderGraphics() {
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            // Draw Sky
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#0a0a1a');
            skyGrad.addColorStop(1, '#151535');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // Draw Synthwave Grid Horizon Lines
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
            ctx.lineWidth = 4;
            for (let i = 0; i < V_WIDTH; i += 300) {
                ctx.beginPath();
                ctx.moveTo(i + (roadOffset * 0.2), 600);
                ctx.lineTo(i + (roadOffset * 0.2), groundY);
                ctx.stroke();
            }

            // Draw Road
            ctx.fillStyle = '#111116';
            ctx.fillRect(0, groundY, V_WIDTH, V_HEIGHT - groundY);

            // Neon Road Boundary Edge
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            ctx.fillRect(0, groundY, V_WIDTH, 12);
            ctx.shadowBlur = 0; 

            // Road Lines
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = roadOffset; i < V_WIDTH + 200; i += 200) {
                ctx.fillRect(i, groundY + 150, 100, 12);
            }

            // Draw Motorcycle
            ctx.save();
            const rearAxleX = bike.x;
            const rearAxleY = groundY - bike.wheelRadius;
            ctx.translate(rearAxleX, rearAxleY);
            ctx.rotate(-bike.angle);

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(bike.length * 0.4, -bike.wheelRadius * 1.3);
            ctx.lineTo(bike.length * 0.8, -bike.wheelRadius * 1.4);
            ctx.lineTo(bike.length * 0.35, 0);
            ctx.closePath();
            ctx.stroke();

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(bike.length * 0.8, -bike.wheelRadius * 1.4);
            ctx.lineTo(bike.length, 0);
            ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.arc(0, 0, bike.wheelRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(bike.length, 0, bike.wheelRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-bike.wheelRadius, 0); ctx.lineTo(bike.wheelRadius, 0);
            ctx.moveTo(0, -bike.wheelRadius); ctx.lineTo(0, bike.wheelRadius);
            ctx.stroke();

            ctx.save();
            ctx.translate(bike.length, 0);
            ctx.rotate(roadOffset * 0.05);
            ctx.beginPath();
            ctx.moveTo(-bike.wheelRadius, 0); ctx.lineTo(bike.wheelRadius, 0);
            ctx.moveTo(0, -bike.wheelRadius); ctx.lineTo(0, bike.wheelRadius);
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#222';
            ctx.fillRect(bike.length * 0.1, -bike.wheelRadius * 1.45, bike.length * 0.25, 25);

            ctx.restore();

            // Render UI Interface Elements Directly onto Canvas
            if (gameState === 'PLAYING') {
                ctx.fillStyle = '#00ffcc';
                ctx.font = '900 110px system-ui, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`SCORE: ${Math.floor(score)}`, 150, 200);
            } else {
                // Dim scene with full screen fill mask
                ctx.fillStyle = 'rgba(5, 5, 15, 0.85)';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                ctx.textAlign = 'center';
                
                if (gameState === 'MENU') {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 180px system-ui, sans-serif';
                    ctx.fillText("WHEELIE PARTY", V_WIDTH / 2, V_HEIGHT / 2 - 250);

                    ctx.fillStyle = '#8a8ab0';
                    ctx.font = '500 55px system-ui, sans-serif';
                    ctx.fillText("Hold SPACEBAR, UP ARROW, or CLICK & HOLD anywhere to pull back.", V_WIDTH / 2, V_HEIGHT / 2 - 80);
                    ctx.fillText("Score points continuously by keeping your front wheel off the ground!", V_WIDTH / 2, V_HEIGHT / 2 + 10);
                } else if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = '#ff0055';
                    ctx.font = '900 180px system-ui, sans-serif';
                    ctx.fillText("FLIPPED OVER!", V_WIDTH / 2, V_HEIGHT / 2 - 250);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '700 80px system-ui, sans-serif';
                    ctx.fillText(`FINAL SCORE: ${Math.floor(score)}`, V_WIDTH / 2, V_HEIGHT / 2 - 60);
                }

                // Render Canvas Interactive Pill Button
                const btnX = V_WIDTH / 2 - 300;
                const btnY = V_HEIGHT / 2 + 250;
                const btnW = 600;
                const btnH = 160;

                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, btnW, btnH, 80);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.font = '900 65px system-ui, sans-serif';
                ctx.fillText(gameState === 'MENU' ? "RIDE" : "TRY AGAIN", V_WIDTH / 2, btnY + 105);
            }
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                updatePhysics();
            }
            renderGraphics();
            requestAnimationFrame(gameLoop);
}
gameLoop();
